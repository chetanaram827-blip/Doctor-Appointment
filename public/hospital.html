<!DOCTYPE html>
<html>
<head>
    <title>Hospital Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Hospital Search</h1>

    <input type="text" id="city" placeholder="Enter City">

    <input type="text" id="area" placeholder="Enter Area">

    <button onclick="searchHospitals()">Search</button>

    <div id="hospitalList"></div>

    <script>
        async function searchHospitals() {

            const city = document.getElementById("city").value.trim();
            const area = document.getElementById("area").value.trim();

            let url = "/hospitals";

            if (city || area) {

                const params = new URLSearchParams();

                if (city) {
                    params.append("city", city);
                }

                if (area) {
                    params.append("area", area);
                }

                url = "/hospitals/search?" + params.toString();
            }

            try {

                // Get hospitals
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Failed to fetch hospitals");
                }

                const hospitals = await response.json();

                // Get areas
                const areaResponse = await fetch("/areas");

                if (!areaResponse.ok) {
                    throw new Error("Failed to fetch areas");
                }

                const areas = await areaResponse.json();

                // Convert Area ID to Area Name
                hospitals.forEach(function(hospital) {

                    const areaData = areas.find(function(item) {
                        return item._id === hospital.area;
                    });

                    if (areaData) {
                        hospital.area = areaData.name;
                    }

                });

                const list = document.getElementById("hospitalList");

                if (hospitals.length === 0) {

                    list.innerHTML = "<p>No hospitals found.</p>";

                    return;
                }

                list.innerHTML = hospitals.map(hospital => `
                    <div>

                        <h2>${hospital.name}</h2>

                        <p>
                            <strong>Area:</strong>
                            ${hospital.area || "N/A"}
                        </p>

                        <p>
                            <strong>City:</strong>
                            ${hospital.city}
                        </p>

                        <p>
                            <strong>Address:</strong>
                            ${hospital.address}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            ${hospital.phone}
                        </p>

                    </div>

                    <hr>
                `).join("");

            } catch (error) {

                console.error(error);

                document.getElementById("hospitalList").innerHTML =
                    "<p>Failed to load hospitals.</p>";
            }
        }

        // Page open ayinappudu all hospitals load avutayi
        searchHospitals();

    </script>

</body>
</html>
