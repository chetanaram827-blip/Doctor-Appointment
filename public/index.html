<!DOCTYPE html>
<html>
<head>
    <title>Doctor Appointment System</title>
</head>

<body>

    <h1>Doctor Appointment System</h1>

    <h2>Book Appointment</h2>

    <form id="appointmentForm">

        <label>Patient Name:</label>
        <input type="text" id="patientName" required>
        <br><br>

        <label>Doctor:</label>
        <select id="doctor" required>
            <option value="">Loading Doctors...</option>
        </select>
        <br><br>

        <label>Date:</label>
        <input type="date" id="date" required>
        <br><br>

        <label>Available Time Slot:</label>
        <select id="timeSlot" required>
            <option value="">Select Doctor and Date</option>
        </select>
        <br><br>

        <label>Reason:</label>
        <input type="text" id="reason" required>
        <br><br>

        <button type="submit">Book Appointment</button>

    </form>

    <script>

        const doctorSelect = document.getElementById("doctor");
        const dateInput = document.getElementById("date");
        const timeSlotSelect = document.getElementById("timeSlot");


        // Load doctors from backend
        async function loadDoctors() {

            try {

                const response = await fetch("/doctors");

                if (!response.ok) {
                    throw new Error("Failed to fetch doctors");
                }

                const doctors = await response.json();

                doctorSelect.innerHTML =
                    '<option value="">Select Doctor</option>';

                doctors.forEach(function(doctor) {

                    const option = document.createElement("option");

                    option.value = doctor._id;

                    option.textContent =
                        doctor.name + " - " + doctor.specialization;

                    doctorSelect.appendChild(option);

                });

            } catch (error) {

                console.log(error);

                doctorSelect.innerHTML =
                    '<option value="">Failed to load doctors</option>';

            }

        }


        // Load available time slots
        async function loadTimeSlots() {

            const doctorId = doctorSelect.value;
            const selectedDate = dateInput.value;

            if (!doctorId || !selectedDate) {

                timeSlotSelect.innerHTML =
                    '<option value="">Select Doctor and Date</option>';

                return;
            }

            try {

                const response = await fetch("/timeslots");

                if (!response.ok) {
                    throw new Error("Failed to fetch time slots");
                }

                const timeSlots = await response.json();

                timeSlotSelect.innerHTML =
                    '<option value="">Select Time Slot</option>';

                const availableSlots = timeSlots.filter(function(slot) {

                    const slotDoctorId =
                        slot.doctor._id || slot.doctor;

                    return (
                        slotDoctorId === doctorId &&
                        slot.date === selectedDate &&
                        slot.isBooked === false
                    );

                });


                if (availableSlots.length === 0) {

                    timeSlotSelect.innerHTML =
                        '<option value="">No available slots</option>';

                    return;
                }


                availableSlots.forEach(function(slot) {

                    const option = document.createElement("option");

                    option.value = slot._id;

                    option.textContent =
                        slot.startTime + " - " + slot.endTime;

                    timeSlotSelect.appendChild(option);

                });

            } catch (error) {

                console.log(error);

                timeSlotSelect.innerHTML =
                    '<option value="">Failed to load slots</option>';

            }

        }


        doctorSelect.addEventListener(
            "change",
            loadTimeSlots
        );

        dateInput.addEventListener(
            "change",
            loadTimeSlots
        );


        // Book appointment
        document.getElementById("appointmentForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const doctorId = doctorSelect.value;
                const timeSlotId = timeSlotSelect.value;


                if (!timeSlotId) {

                    alert(
                        "Please select an available time slot."
                    );

                    return;
                }


                const selectedOption =
                    timeSlotSelect.options[
                        timeSlotSelect.selectedIndex
                    ];


                const appointment = {

                    patientName:
                        document.getElementById("patientName").value,

                    doctorName:
                        doctorSelect.options[
                            doctorSelect.selectedIndex
                        ].text.split(" - ")[0],

                    doctor:
                        doctorId,

                    timeSlot:
                        timeSlotId,

                    date:
                        dateInput.value,

                    time:
                        selectedOption.textContent,

                    reason:
                        document.getElementById("reason").value

                };


                try {

                    const response = await fetch(
                        "/appointments",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(appointment)
                        }
                    );


                    const data =
                        await response.json();


                    alert(
                        data.message +
                        "\n" +
                        (data.error || "")
                    );


                    if (response.ok) {

                        document.getElementById(
                            "appointmentForm"
                        ).reset();

                        timeSlotSelect.innerHTML =
                            '<option value="">Select Doctor and Date</option>';

                    }


                } catch (error) {

                    console.log(error);

                    alert("Something went wrong");

                }

            });


        // Load doctors when page opens
        loadDoctors();

    </script>

</body>
</html>
